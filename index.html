<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rumbo al Splendida</title>
  <meta name="description" content="Cuenta regresiva para nuestro crucero familiar en el MSC Splendida.">
  <meta property="og:title" content="Rumbo al MSC Splendida 🚢">
  <meta property="og:description" content="Cuenta regresiva para nuestro crucero familiar · 19 de diciembre">
  <meta property="og:image" content="familia.jpg">
  <meta name="theme-color" content="#0d2a4a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d2a4a;
      --navy-deep: #081a30;
      --sea: #1f5f8b;
      --sun: #ffb36b;
      --coral: #ff7e67;
      --sand: #fff4e6;
      --ink: #fdf8f2;
      --muted: rgba(253, 248, 242, 0.72);
      --glass: rgba(255, 255, 255, 0.10);
      --glass-border: rgba(255, 255, 255, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 179, 107, 0.35), transparent 70%),
        linear-gradient(180deg, #f3a37a 0%, #c9707a 18%, #5a4a7a 38%, var(--navy) 62%, var(--navy-deep) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .sun {
      position: fixed;
      top: -140px;
      left: 50%;
      width: 420px;
      height: 420px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 214, 150, 0.55) 0%, rgba(255, 179, 107, 0.15) 45%, transparent 70%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 0;
      animation: breathe 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 16px 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sand);
      padding: 8px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      animation: rise 0.9s 0.1s ease-out forwards;
    }

    .eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--sun); }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.6rem, 8vw, 5rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-top: 22px;
      text-shadow: 0 2px 30px rgba(8, 26, 48, 0.25);
      opacity: 0;
      animation: rise 0.9s 0.25s ease-out forwards;
    }

    h1 em {
      font-style: italic;
      font-weight: 600;
      background: linear-gradient(90deg, #fff1d6, var(--sun) 50%, #ffd6c4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 14px;
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      color: var(--muted);
      max-width: 44ch;
      text-wrap: balance;
      opacity: 0;
      animation: rise 0.9s 0.4s ease-out forwards;
    }

    .photo {
      position: relative;
      margin-top: 40px;
      width: 100%;
      max-width: 760px;
      padding: 10px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 30px 60px -20px rgba(8, 26, 48, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      animation: rise 1s 0.55s ease-out forwards;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1448 / 1086;
      object-fit: cover;
      border-radius: 20px;
    }

    .photo figcaption {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--sand);
      padding: 14px 8px 6px;
    }

    .countdown-label {
      margin-top: 56px;
      font-size: 0.8rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--sun);
      font-weight: 700;
    }

    .countdown {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 680px;
    }

    .unit {
      padding: 22px 8px 18px;
      border-radius: 22px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px -12px rgba(8, 26, 48, 0.6);
    }

    .unit .num {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.1rem, 7vw, 3.6rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    .unit .num.tick { animation: tick 0.45s ease-out; }

    @keyframes tick {
      0% { transform: translateY(-6px); opacity: 0.4; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .unit .lbl {
      display: block;
      margin-top: 10px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .date-line {
      margin-top: 26px;
      font-size: 0.98rem;
      color: var(--muted);
    }

    .date-line strong { color: var(--sand); font-weight: 500; }

    .arrived {
      display: none;
      margin-top: 18px;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: var(--sand);
    }

    body.is-here .countdown { display: none; }
    body.is-here .arrived { display: block; }

    .waves {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 140px;
      pointer-events: none;
      z-index: 0;
    }

    .waves svg {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 100%;
    }

    .waves .w1 { animation: drift 18s linear infinite; opacity: 0.35; }
    .waves .w2 { animation: drift 12s linear infinite reverse; opacity: 0.5; bottom: -12px; }
    .waves .w3 { animation: drift 24s linear infinite; opacity: 0.9; bottom: -28px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .ship {
      position: fixed;
      bottom: 62px;
      left: -60px;
      font-size: 30px;
      z-index: 0;
      pointer-events: none;
      animation: sail 40s linear infinite, bob 3s ease-in-out infinite;
    }

    @keyframes sail {
      from { left: -60px; }
      to { left: calc(100% + 60px); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      margin-top: 48px;
      font-size: 0.82rem;
      color: rgba(253, 248, 242, 0.5);
    }

    @media (max-width: 520px) {
      main { padding-top: 40px; }
      .countdown { gap: 8px; }
      .unit { padding: 16px 4px 14px; border-radius: 16px; }
      .unit .lbl { font-size: 0.62rem; letter-spacing: 0.12em; }
      .photo { padding: 6px; border-radius: 20px; }
      .photo img { border-radius: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; opacity: 1 !important; }
      .ship { display: none; }
    }
  </style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>

  <main>
    <span class="eyebrow">MSC Splendida <span class="dot"></span> Diciembre 2026</span>

    <h1>Rumbo al <em>mar</em></h1>
    <p class="subtitle">La familia junta otra vez, con el horizonte por delante.</p>

    <figure class="photo">
      <img src="familia.jpg" alt="Foto de la familia en la cubierta del crucero al atardecer" width="1448" height="1086">
      <figcaption>Nosotros, listos para zarpar ✦</figcaption>
    </figure>

    <p class="countdown-label">Faltan</p>

    <div class="countdown" role="timer" aria-live="off">
      <div class="unit"><span class="num" id="d">--</span><span class="lbl">Días</span></div>
      <div class="unit"><span class="num" id="h">--</span><span class="lbl">Horas</span></div>
      <div class="unit"><span class="num" id="m">--</span><span class="lbl">Minutos</span></div>
      <div class="unit"><span class="num" id="s">--</span><span class="lbl">Segundos</span></div>
    </div>

    <p class="arrived">¡Llegó el día! Buen viaje 🌊</p>

    <p class="date-line">Zarpamos el <strong>sábado 19 de diciembre de 2026</strong></p>

    <footer>Hecho con ganas de vacaciones</footer>
  </main>

  <span class="ship" aria-hidden="true">🛳️</span>

  <div class="waves" aria-hidden="true">
    <svg class="w1" viewBox="0 0 2880 140" preserveAspectRatio="none">
      <path fill="#2b6f9e" d="M0 70 C240 30 480 110 720 70 S1200 30 1440 70 S1920 110 2160 70 S2640 30 2880 70 V140 H0Z"/>
    </svg>
    <svg class="w2" viewBox="0 0 2880 140" preserveAspectRatio="none">
      <path fill="#1a4f78" d="M0 80 C180 50 360 110 720 80 S1080 50 1440 80 S1800 110 2160 80 S2520 50 2880 80 V140 H0Z"/>
    </svg>
    <svg class="w3" viewBox="0 0 2880 140" preserveAspectRatio="none">
      <path fill="#0a2240" d="M0 90 C300 60 420 120 720 90 S1140 60 1440 90 S1860 120 2160 90 S2580 60 2880 90 V140 H0Z"/>
    </svg>
  </div>

  <script>
    // Fecha y hora de embarque (hora de Argentina, UTC-3). Cambiá la hora si la sabés.
    const SALIDA = new Date("2026-12-19T00:00:00-03:00");

    const els = {
      d: document.getElementById("d"),
      h: document.getElementById("h"),
      m: document.getElementById("m"),
      s: document.getElementById("s"),
    };
    const prev = {};

    function set(key, value) {
      const text = key === "d" ? String(value) : String(value).padStart(2, "0");
      if (prev[key] === text) return;
      prev[key] = text;
      const el = els[key];
      el.textContent = text;
      el.classList.remove("tick");
      void el.offsetWidth;
      el.classList.add("tick");
    }

    function update() {
      const diff = SALIDA - Date.now();
      if (diff <= 0) {
        document.body.classList.add("is-here");
        clearInterval(timer);
        return;
      }
      const total = Math.floor(diff / 1000);
      set("d", Math.floor(total / 86400));
      set("h", Math.floor((total % 86400) / 3600));
      set("m", Math.floor((total % 3600) / 60));
      set("s", total % 60);
    }

    const timer = setInterval(update, 1000);
    update();
  </script>
</body>
</html>
